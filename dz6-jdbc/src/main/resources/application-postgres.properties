# Внешняя PostgreSQL. Значения по умолчанию совпадают с docker-compose.yml из корня проекта.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:messages}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:messages}
spring.datasource.password=${DB_PASSWORD:messages}
